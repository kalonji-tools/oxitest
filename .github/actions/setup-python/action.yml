name: Setup Python
description: Setup uv with caching and optionally sync dependency groups

inputs:
  python-version:
    description: Python version to install
    required: false
    default: '3.12'
  uv-sync-args:
    description: Arguments to pass to `uv sync` (e.g. --only-group coverage). Skipped if empty.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - if: inputs.uv-sync-args != ''
      run: uv sync ${{ inputs.uv-sync-args }}
      shell: bash
