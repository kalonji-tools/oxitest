name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --only-group lint

      - run: uv run ruff check python/
      - run: uv run ruff format --check python/
      - run: uv run codespell
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ matrix.python-version == '3.12' }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --group test --group typecheck

      - name: Rust tests
        if: matrix.python-version == '3.12'
        run: cargo test

      - name: Build extension
        run: uv run maturin develop

      - name: ty check
        if: matrix.python-version == '3.12'
        run: uv run ty check

      - name: Python tests
        run: PYTHONPATH=python uv run python -m oxitest python/tests/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - run: uv sync --group coverage

      - name: Build extension
        run: uv run maturin develop

      - name: Rust coverage
        run: cargo tarpaulin --out xml

      - name: Python coverage
        run: |
          PYTHONPATH=python uv run coverage run --source=oxitest -m oxitest python/tests/
          uv run coverage xml

      - name: Upload Rust coverage
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Python coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

  guard:
    name: No plans/specs on main
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Check for plans/specs files
        run: |
          found=$(git ls-tree -r --name-only HEAD -- \
            docs/superpowers/plans docs/superpowers/specs 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "ERROR: plans/specs files found on main:"
            echo "$found"
            exit 1
          fi
