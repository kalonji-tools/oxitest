name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install tools
        run: |
          uv tool install prek
          uv sync --only-group lint --only-group typecheck --only-group test
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run quality checks
        run: prek run --all-files --show-diff-on-failure

      - name: Run pre-push checks
        run: prek run --all-files --stage pre-push

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ matrix.python-version == '3.12' }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --group test --group typecheck

      - name: Rust tests
        if: matrix.python-version == '3.12'
        run: cargo test

      - name: Build extension
        run: uv run maturin develop

      - name: ty check
        if: matrix.python-version == '3.12'
        run: uv run ty check

      - name: Python tests
        run: PYTHONPATH=python uv run python -m oxitest python/tests/

  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run Rust coverage
        run: cargo llvm-cov --cobertura --output-path cobertura.xml

      - name: Summarise Rust coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cobertura.xml
          format: markdown
          output: both

      - name: Post Rust coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: rust-coverage
          path: code-coverage-results.md

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          save-if: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - run: uv sync --group coverage

      - name: Build extension
        run: uv run maturin develop

      - name: Run Python coverage
        run: |
          PYTHONPATH=python uv run coverage run --source=oxitest -m oxitest python/tests/
          uv run coverage xml

      - name: Summarise Python coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          format: markdown
          output: both

      - name: Post Python coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: python-coverage
          path: code-coverage-results.md

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
