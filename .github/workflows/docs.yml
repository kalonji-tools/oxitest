name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect docs changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      doc-tests: ${{ steps.filter.outputs.doc-tests }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/user/**'
              - 'docs/internals/**'
              - 'mkdocs.yml'
              - 'pyproject.toml'
              - '.github/workflows/docs.yml'
            doc-tests:
              - 'python/tests/docs/**'
              # this job compiles the extension via `maturin develop`
              - 'rust-toolchain.toml'
              # the code the doc examples exercise — without these the job can
              # only be triggered by editing its own tests, so every change
              # that could break a documented example skipped it silently (#1925)
              - 'src/**'
              - 'python/oxitest/**'
              - 'Cargo.*'
              - 'pyproject.toml'
              - '.github/workflows/docs.yml'

  build:
    name: Build docs
    needs: changes
    if: >-
      github.event_name != 'pull_request'
      || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required by git-revision-date-localized

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --only-group docs

      - name: Build
        run: uv run mkdocs build --strict

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'

      - name: Install mdbook-mermaid
        run: |
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.0/mdbook-mermaid-v0.17.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin

      - name: Build internals book
        run: mdbook build docs/internals

      - name: Assemble deploy directory
        run: |
          mkdir -p deploy/internals
          cp docs/index.html deploy/
          cp -r docs/site deploy/site
          cp -r docs/internals/book deploy/internals/book
          cp docs/internals/architecture-map.html deploy/internals/

      - name: Validate landing page links
        run: |
          set -euo pipefail
          landing="deploy/index.html"
          [[ -f "$landing" ]] || { echo "missing $landing" >&2; exit 1; }

          mapfile -t targets < <(
            grep -oE '(href|src)="[^"]+"' "$landing" \
              | sed -E 's/.*="([^"]+)"/\1/' \
              | grep -vE '^(https?:|mailto:|#)'
          )

          failed=0
          for t in "${targets[@]}"; do
            [[ "$t" == */ ]] && t="${t}index.html"
            if [[ ! -e "deploy/$t" ]]; then
              echo "BAD: $t -> deploy/$t missing" >&2
              failed=1
            fi
          done
          exit $failed

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: docs-preview
          path: deploy

      - uses: actions/upload-pages-artifact@v5
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          path: deploy

  doc-tests:
    name: Doc Tests
    needs: changes
    if: needs.changes.outputs.doc-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Toolchain comes from rust-toolchain.toml — see that file (#1792).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --group test

      - name: Build extension
        run: uv run maturin develop

      - name: Doc example tests
        run: uv run python -m oxitest python/tests/docs/ --strict=off

  required:
    name: Docs (required)
    needs: [changes, build, doc-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the change filter ran
        shell: bash
        run: |
          # `changes` decides what gets built and tested, so unlike the jobs
          # below it has no `skipped` allowance (#1925). It carries no `if:`
          # and no `needs:`, so it always runs: any result other than success
          # means the docs selection is unknown rather than empty (#1961).
          case "${{ needs.changes.result }}" in
            success) ;;
            *) echo "Detect docs changes ended in '${{ needs.changes.result }}'; the docs selection is unknown"; exit 1 ;;
          esac

      - name: Check build result
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Allowlist, not a failure-blocklist: a job that ends in anything
          # other than success or skipped — cancelled, timed_out — used to pass
          # this gate, because it only ever tested for "failure" (#1925).
          #
          # Reads results from toJSON(needs), and prints the observed set before
          # judging it — see test.yml's `required` job for the full reasoning
          # (#2072).
          echo "Jobs this rollup waited on:"
          echo "$NEEDS" | jq -r 'del(.changes) | to_entries[] | "  \(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            del(.changes)
            | (length > 0)
              and all(.[]; .result == "success" or .result == "skipped")
          ' > /dev/null || {
            echo "A docs job did not pass; only success or skipped may pass"
            exit 1
          }
          echo "All docs jobs passed or were skipped"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
