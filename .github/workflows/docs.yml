name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect docs changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      doc-tests: ${{ steps.filter.outputs.doc-tests }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/user/**'
              - 'docs/internals/**'
              - 'mkdocs.yml'
              - 'pyproject.toml'
              - '.github/workflows/docs.yml'
            doc-tests:
              - 'python/tests/docs/**'
              # this job compiles the extension via `maturin develop`
              - 'rust-toolchain.toml'

  build:
    name: Build docs
    needs: changes
    if: >-
      github.event_name != 'pull_request'
      || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required by git-revision-date-localized

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --only-group docs

      - name: Build
        run: uv run mkdocs build --strict

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'

      - name: Install mdbook-mermaid
        run: |
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.0/mdbook-mermaid-v0.17.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin

      - name: Build internals book
        run: mdbook build docs/internals

      - name: Assemble deploy directory
        run: |
          mkdir -p deploy/internals
          cp docs/index.html deploy/
          cp -r docs/site deploy/site
          cp -r docs/internals/book deploy/internals/book
          cp docs/internals/architecture-map.html deploy/internals/

      - name: Validate landing page links
        run: |
          set -euo pipefail
          landing="deploy/index.html"
          [[ -f "$landing" ]] || { echo "missing $landing" >&2; exit 1; }

          mapfile -t targets < <(
            grep -oE '(href|src)="[^"]+"' "$landing" \
              | sed -E 's/.*="([^"]+)"/\1/' \
              | grep -vE '^(https?:|mailto:|#)'
          )

          failed=0
          for t in "${targets[@]}"; do
            [[ "$t" == */ ]] && t="${t}index.html"
            if [[ ! -e "deploy/$t" ]]; then
              echo "BAD: $t -> deploy/$t missing" >&2
              failed=1
            fi
          done
          exit $failed

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: docs-preview
          path: deploy

      - uses: actions/upload-pages-artifact@v5
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          path: deploy

  doc-tests:
    name: Doc Tests
    needs: changes
    if: needs.changes.outputs.doc-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Toolchain comes from rust-toolchain.toml — see that file (#1792).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --group test

      - name: Build extension
        run: uv run maturin develop

      - name: Doc example tests
        run: uv run python -m oxitest python/tests/docs/ --strict=off

  required:
    name: Docs (required)
    needs: [build, doc-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check build result
        shell: bash
        run: |
          if [[ "${{ needs.build.result }}" == "failure" || "${{ needs.doc-tests.result }}" == "failure" ]]; then
            echo "One or more docs jobs failed"
            exit 1
          fi
          echo "All docs jobs passed or were skipped"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
