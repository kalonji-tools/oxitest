name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist -i python3.11 python3.12 python3.13 python3.14

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14

      - uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist -i python3.11 python3.12 python3.13 python3.14

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: dist

  # Windows joined the supported set when #1989 promoted its test job into the
  # `Tests (required)` rollup. ADR-0013 derives wheel targets from the tested
  # set, so the target follows the job rather than the other way round.
  #
  # This job cannot be exercised by a pull request — `publish.yml` runs on tag
  # push only. What is established is that maturin builds oxitest on this
  # runner: `.github/actions/platform-test` runs `uv run maturin develop` on
  # `windows-latest` and that job is required and green. What is not is this
  # job's four-interpreter release build. It is in `publish`'s `needs:` below,
  # so a failure here blocks the upload rather than shipping a partial release.
  # One job per interpreter, rather than the `macos` job's single job with four
  # versions and `-i python3.11 python3.12 ...`. That spelling is Unix-only:
  # `actions/setup-python` gives each version its own tool-cache directory on
  # PATH, and on Linux and macOS each holds a `python3.11` file while on Windows
  # each holds only `python.exe` and `python3.exe`. There is no
  # `python3.11.exe`, so `-i` would find none of the four.
  #
  # `--find-interpreter` with exactly one Python on PATH assumes no name
  # resolution at all. It is also the shape maturin itself generates for
  # Windows: `src/ci/github/__snapshot__/github_default.yml` in PyO3/maturin
  # passes `--release --out dist --find-interpreter` and never `-i pythonX.Y`.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist --find-interpreter

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [linux, macos, windows, sdist]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          found=false
          while IFS= read -r line; do
            if [[ "$line" =~ ^##\ \[$VERSION\] ]]; then
              found=true
              echo "$line"
              continue
            fi
            if $found; then
              if [[ "$line" =~ ^##\  ]]; then
                break
              fi
              echo "$line"
            fi
          done < CHANGELOG.md > release-notes.txt

          if [ ! -s release-notes.txt ]; then
            echo "::warning::No CHANGELOG entry found for $VERSION, using fallback"
            echo "Release $GITHUB_REF_NAME" > release-notes.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-notes.txt
