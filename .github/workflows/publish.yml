name: Publish to PyPI

# The Distribution band gate below can only be exercised by running this
# workflow, and a tag push is the one thing you cannot rehearse: the version is
# on `main` before any wheel is built, so a gate that is wrong is discovered
# after the tag exists and the correction is a new version (#2177).
#
# `workflow_dispatch` makes the whole matrix runnable on demand from any ref,
# with no tag and no upload. `publish` and `release` are guarded on the ref
# being a tag, so no path other than a `v*` push can reach PyPI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist -i python3.11 python3.12 python3.13 python3.14

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14

      - uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist -i python3.11 python3.12 python3.13 python3.14

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: dist

  # Windows joined the supported set when #1989 promoted its test job into the
  # `Tests (required)` rollup. ADR-0013 derives wheel targets from the tested
  # set, so the target follows the job rather than the other way round.
  #
  # This job cannot be exercised by a pull request — `publish.yml` runs on tag
  # push only. What is established is that maturin builds oxitest on this
  # runner: `.github/actions/platform-test` runs `uv run maturin develop` on
  # `windows-latest` and that job is required and green. What is not is this
  # job's four-interpreter release build. It is in `publish`'s `needs:` below,
  # so a failure here blocks the upload rather than shipping a partial release.
  # What this job produces is installed and imported by the `gate` job before
  # the upload, so the half of this job with no history is the build, not the
  # artifact (#2177).
  # One job per interpreter, rather than the `macos` job's single job with four
  # versions and `-i python3.11 python3.12 ...`. That spelling is Unix-only:
  # `actions/setup-python` gives each version its own tool-cache directory on
  # PATH, and on Linux and macOS each holds a `python3.11` file while on Windows
  # each holds only `python.exe` and `python3.exe`. There is no
  # `python3.11.exe`, so `-i` would find none of the four.
  #
  # `--find-interpreter` with exactly one Python on PATH assumes no name
  # resolution at all. It is also the shape maturin itself generates for
  # Windows: `src/ci/github/__snapshot__/github_default.yml` in PyO3/maturin
  # passes `--release --out dist --find-interpreter` and never `-i pythonX.Y`.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist --find-interpreter

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  # The Distribution band (ADR-0019). Every artifact installs, imports from
  # outside the source tree, and runs the CLI once, before anything is
  # uploaded. PyPI does not permit a filename to be uploaded a second time, so
  # a bad wheel is permanent; this job refuses rather than reports.
  #
  # `--only-binary :all:` is load-bearing, not decoration. `dist/` holds the
  # sdist beside the 16 wheels, so without it a leg with no matching wheel
  # builds from source and passes. With it pip refuses, and that refusal is the
  # artifact-coverage assertion — no list of expected filenames exists
  # anywhere, so this job adds no platform literal that nothing compares.
  #
  # The runner set and the interpreter set are both read by
  # `scripts/check_platform_sets.py`, so neither can drift from `test.yml` or
  # from `requires-python`.
  #
  # `universal2` is one wheel and two runners: installing it on `macos-latest`
  # and on `macos-15-intel` is the only proof that both of its slices load.
  gate:
    name: Gate (${{ matrix.runner }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    needs: [linux, macos, windows, sdist]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # `properties` is attached per runner rather than crossed, which is
        # what `include` does when its keys match an existing combination and
        # add no key that would overwrite one. GitHub's own documented example
        # is this shape: `animal: cat` selects the combinations and `color` is
        # added to them. So this is 20 legs, not 25.
        #
        # The manylinux property applies to the Linux legs alone. An absent
        # value is not a silent skip: the checker refuses an empty
        # `--properties`, so a leg whose key never arrived fails loudly rather
        # than asserting nothing.
        include:
          - runner: ubuntu-latest
            properties: manifest,import,metadata,tag,manylinux
          - runner: ubuntu-24.04-arm
            properties: manifest,import,metadata,tag,manylinux
          - runner: macos-latest
            properties: manifest,import,metadata,tag
          - runner: macos-15-intel
            properties: manifest,import,metadata,tag
          - runner: windows-latest
            properties: manifest,import,metadata,tag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      # Installed into the runner's interpreter, with no virtual environment.
      # `actions/setup-python` above already gives this leg a clean one, and
      # oxitest declares no runtime dependency, so a virtual environment adds
      # no isolation. It did add a path: an environment keeps its interpreter
      # in `bin/` on POSIX and `Scripts/` on Windows, and resolving that in
      # `bash` meant carrying `$RUNNER_TEMP` -- which is `D:\a\_temp` on the
      # four Windows legs -- through a shell that reads a backslash as an
      # escape. These three steps now read the same on all five runners.
      - name: Install the artifact
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --no-index --only-binary :all: --find-links dist oxitest

      # `working-directory` puts the source tree outside the working directory,
      # which is what the import property asserts. `check_artifact.py` refuses
      # when the working directory is inside `--source-root`, so a change here
      # that made the property vacuous fails rather than passes.
      - name: Assert the properties
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/check_artifact.py" \
            --source-root "$GITHUB_WORKSPACE" \
            --properties '${{ matrix.properties }}'

      - name: Run the CLI once
        shell: bash
        working-directory: ${{ runner.temp }}
        run: oxitest --version

  # Property 6: the sdist builds. `pyproject.toml` excludes
  # `rust-toolchain.toml` from the sdist so a source build uses whatever
  # toolchain the machine already holds, and no job has ever exercised that.
  #
  # A build, an import, and one CLI run. Not the suite: ADR-0019 removed the
  # two duties the Command and Library bands already discharge, because a suite
  # run here proves nothing the wheel path has not proved.
  gate-sdist:
    name: Gate (sdist)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [sdist]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # No `rustup` step. `pyproject.toml` excludes `rust-toolchain.toml` from
      # the sdist so that a source build uses the toolchain the machine already
      # holds, and the `ubuntu-latest` image ships a stable one. Installing a
      # chosen toolchain here would replace the thing under test.
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-sdist
          merge-multiple: true
          path: dist

      # The toolchain is printed rather than installed. `pyproject.toml`
      # excludes `rust-toolchain.toml` from the sdist so that a source build
      # uses whatever the machine already holds, and this step records which
      # one that was. It fails loudly if there is none, which is the answer to
      # the same question.
      - name: Record the toolchain this build uses
        run: rustc --version && cargo --version

      # Two installs, and the split is load-bearing.
      #
      # `--no-index` on the second command is what keeps oxitest sourced from
      # `dist/` alone -- without it pip may resolve the name from PyPI and this
      # leg would examine the *released* sdist rather than the one just built.
      # But `--no-index` also blocks the build backend, and a source build needs
      # one: `[build-system] requires = ["maturin>=1.7,<2"]`. The first run of
      # this job failed exactly there, with `ERROR: Could not find a version
      # that satisfies the requirement maturin<2,>=1.7 (from versions: none)`.
      #
      # So the backend is installed first, from the index, and the second
      # command adds `--no-build-isolation` to make pip use it instead of
      # building an isolated environment it cannot populate.
      #
      # `--no-binary :all:` is the mirror of the wheel legs' `--only-binary`.
      # Without it pip would take a wheel if one were present and this leg
      # would prove nothing about the sdist.
      - name: Install the build backend
        run: python -m pip install --disable-pip-version-check "maturin>=1.7,<2"

      - name: Build and install from source
        run: |
          python -m pip install --disable-pip-version-check \
            --no-index --no-binary :all: --no-build-isolation \
            --find-links dist oxitest

      - name: Assert the properties
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/check_artifact.py" \
            --source-root "$GITHUB_WORKSPACE" --properties manifest,import

      - name: Run the CLI once
        working-directory: ${{ runner.temp }}
        run: oxitest --version

  # The upload runs for a tag and for nothing else. This guard is what makes
  # `workflow_dispatch` and any branch trigger safe: both build the artifacts
  # and run the gate, and neither can reach PyPI. `release` needs this job, so
  # a skip here skips that too.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [linux, macos, windows, sdist, gate, gate-sdist]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          found=false
          while IFS= read -r line; do
            if [[ "$line" =~ ^##\ \[$VERSION\] ]]; then
              found=true
              echo "$line"
              continue
            fi
            if $found; then
              if [[ "$line" =~ ^##\  ]]; then
                break
              fi
              echo "$line"
            fi
          done < CHANGELOG.md > release-notes.txt

          if [ ! -s release-notes.txt ]; then
            echo "::warning::No CHANGELOG entry found for $VERSION, using fallback"
            echo "Release $GITHUB_REF_NAME" > release-notes.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.txt
