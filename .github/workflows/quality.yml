name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'python/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'pyproject.toml'
              - 'prek.toml'
              - '.github/**'

  code-quality:
    name: Code Quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Toolchain comes from rust-toolchain.toml — see that file (#1792).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --only-group lint --only-group typecheck --only-group test

      - name: Install tools
        run: |
          uv tool install prek==0.3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run quality checks
        run: prek run --all-files --show-diff-on-failure --skip no-commit-to-branch

      - name: Run pre-push checks
        run: prek run --all-files --stage pre-push --skip no-commit-to-branch --skip affected-tests

  required:
    name: Quality (required)
    needs: [code-quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check result
        shell: bash
        run: |
          # Allowlist, not a failure-blocklist — see docs.yml's `required` job (#1925).
          case "${{ needs.code-quality.result }}" in
            success|skipped) ;;
            *) echo "Code Quality ended in '${{ needs.code-quality.result }}'; only success or skipped may pass"; exit 1 ;;
          esac
          echo "Quality checks passed or were skipped"
