name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'python/**'
              # `just check` lints scripts/ too, and without this the job that
              # runs it cannot be triggered by editing them — a lint gate that
              # only ever runs locally reads as CI coverage it does not have
              # (#1939)
              - 'scripts/**'
              # Same reasoning one line up, for the gate added by #2015: a PR
              # that edits only the justfile is exactly the change that can
              # reintroduce a quoted interpolation, and without this entry it
              # is the one change CI never checks.
              - 'justfile'
              # Same reasoning again, for codespell: it declares no `files`, so
              # `prek run --all-files` reads every Markdown file — but no
              # pattern above matched one, so a Markdown-only PR skipped the
              # only prose check and its typo went red later on someone else's
              # PR. The globstar reaches the repository root too, which is why
              # a second `'*.md'` entry is redundant (#2129).
              - '**/*.md'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'pyproject.toml'
              - 'prek.toml'
              - '.github/**'

  code-quality:
    name: Code Quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Toolchain comes from rust-toolchain.toml — see that file (#1792).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --only-group lint --only-group typecheck --only-group test

      - name: Install tools
        run: |
          uv tool install prek==0.3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run quality checks
        run: prek run --all-files --show-diff-on-failure --skip no-commit-to-branch

      - name: Run pre-push checks
        run: prek run --all-files --stage pre-push --skip no-commit-to-branch

  required:
    name: Quality (required)
    needs: [changes, code-quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the change filter ran
        shell: bash
        run: |
          # `changes` decides what gets checked, so unlike the job below it has
          # no `skipped` allowance (#1925). It carries no `if:` and no `needs:`,
          # so it always runs: any result other than success means the check
          # selection is unknown rather than empty (#1961).
          case "${{ needs.changes.result }}" in
            success) ;;
            *) echo "Detect changes ended in '${{ needs.changes.result }}'; the check selection is unknown"; exit 1 ;;
          esac

      - name: Check result
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Allowlist, not a failure-blocklist — see docs.yml's `required` job (#1925).
          #
          # Reads results from toJSON(needs), and prints the observed set before
          # judging it — see test.yml's `required` job for the full reasoning
          # (#2072).
          echo "Jobs this rollup waited on:"
          echo "$NEEDS" | jq -r 'del(.changes) | to_entries[] | "  \(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            del(.changes)
            | (length > 0)
              and all(.[]; .result == "success" or .result == "skipped")
          ' > /dev/null || {
            echo "A quality job did not pass; only success or skipped may pass"
            exit 1
          }
          echo "Quality checks passed or were skipped"
