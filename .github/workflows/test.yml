name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'python/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'pyproject.toml'
              - '.github/**'

  rust-tests:
    name: Rust Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Toolchain comes from rust-toolchain.toml — see that file (#1792).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --group test

      - uses: taiki-e/install-action@v2.85.10
        with:
          tool: cargo-llvm-cov,cargo-insta

      - name: Check for unreferenced snapshots
        run: cargo insta test --unreferenced=reject

      - name: Rust tests with coverage
        run: cargo llvm-cov --cobertura --output-path cobertura.xml

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-tests:
    name: Test (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      # Toolchain comes from rust-toolchain.toml — see that file (#1792).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ matrix.python-version == '3.12' }}

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          uv-sync-args: --group test

      - name: Build extension
        run: uv run maturin develop

      - name: Python tests
        if: matrix.python-version != '3.12'
        run: uv run python -m oxitest

      - name: Python tests (with coverage)
        if: matrix.python-version == '3.12'
        run: uv run python -m oxitest --cov --cov-report xml

      - name: Upload extension artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: extension-3.12
          path: python/oxitest/_oxitest.cpython-312-*.so
          retention-days: 1

      - name: Upload Python coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Three discrete jobs rather than one matrix. A matrix reports a single
  # aggregate `needs.<job>.result` — see how `python-tests` above, four legs,
  # reaches the rollup below as one string — so per-platform promotion into
  # `needs:` would be impossible. The duplication buys that granularity, and
  # collapsing these back into a matrix silently reverts it (#1944).
  #
  # These test the wheel slices `publish.yml` already ships but has never run:
  # both halves of the macOS `universal2` wheel and the cross-built Linux
  # `aarch64` manylinux wheel. Python 3.12 only — version and platform are
  # orthogonal axes, and four versions are already covered on Linux.
  #
  # Deliberately lighter than the Linux jobs: no `insta --unreferenced`
  # (snapshot hygiene is repo-wide and Linux gates it), no `llvm-cov` or
  # Codecov upload (three more uploads would double-count the same flags),
  # no artifact upload (`extension-3.12` would collide).
  #
  # Their shared steps live in `.github/actions/platform-test` (#1959).
  macos-arm:
    name: Test (macOS arm64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/platform-test

  macos-intel:
    name: Test (macOS x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/platform-test

  linux-arm:
    name: Test (Linux arm64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/platform-test

  # A configuration variant, not a platform. TMPDIR points at a symlink, which
  # reproduces on Linux the path-spelling class #1957 decodes: mkdtemp() returns
  # the unresolved spelling while Path.cwd() reports the resolved one, so any
  # comparison between them fails. Analogous to macOS rather than identical —
  # there the symlinked component is a *parent* (/var -> /private/var), here it
  # is the leaf. The divergence that reproduces the class is the same (#1964).
  #
  # TMPDIR is exported through $GITHUB_ENV rather than a job-level `env:` block.
  # Job-level env cannot reference the `runner` context at all — actionlint
  # rejects it: "context \"runner\" is not allowed here". $GITHUB_ENV also fixes
  # the ordering problem it would have created, because the variable only applies
  # to steps *after* the one that writes it, so the symlink is guaranteed to
  # exist by the time anything reads TMPDIR. The only constraint left is the
  # natural one: this step precedes the composite.
  #
  # It therefore covers every step the composite runs — rustup, rust-cache,
  # setup-uv, uv sync, cargo test and maturin — not just the suite. Deliberate:
  # `cargo test` under a symlinked root was measured green (1686 passed) before
  # this landed, and it reaches Rust's canonicalize sites nothing else does.
  tmpdir-symlink:
    name: Test (symlinked TMPDIR)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Point TMPDIR at a symlinked temp root
        run: |
          mkdir -p "$RUNNER_TEMP/private/T"
          ln -s "$RUNNER_TEMP/private/T" "$RUNNER_TEMP/T"
          # Without this the job degrades silently: if the link ever stops
          # diverging, the suite runs under an ordinary path and passes,
          # reporting coverage it does not have. A no-op gate is worse than no
          # gate, so fail loudly instead (#1964).
          [ "$(readlink -f "$RUNNER_TEMP/T")" != "$RUNNER_TEMP/T" ] \
            || { echo "TMPDIR is not symlinked — this gate would be a no-op"; exit 1; }
          echo "TMPDIR=$RUNNER_TEMP/T" >> "$GITHUB_ENV"

      - uses: ./.github/actions/platform-test

  # Required. It landed advisory, against map #1946 standing preference 5, by
  # maintainer decision: #1986 took Windows from 292 non-passes to 39, and
  # holding a shipped gate-backed improvement behind that residue was the worse
  # trade. #1989 then cleared the 39 and promoted the job into the `required`
  # job's `needs:` below, so the exception closed rather than becoming the
  # permanent-advisory state preference 5 warns about.
  #
  # Windows is therefore in the supported set, and ADR-0013 derives its wheel
  # target and its classifier from that (#1950).
  windows:
    name: Test (Windows x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # 45, against the other platform jobs' 30. #1951 measured the full
    # sequence at ~16 min on this runner against ~6 on Linux arm64, and a
    # Windows-slowness timeout would read as a product failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/platform-test

  required:
    name: Tests (required)
    needs: [changes, rust-tests, python-tests, linux-arm, macos-arm, macos-intel, tmpdir-symlink, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the change filter ran
        shell: bash
        run: |
          # `changes` decides what gets tested, so unlike the jobs below it has
          # no `skipped` allowance (#1925). It carries no `if:` and no `needs:`,
          # so it always runs: any result other than success means the test
          # selection is unknown rather than empty (#1961).
          case "${{ needs.changes.result }}" in
            success) ;;
            *) echo "Detect changes ended in '${{ needs.changes.result }}'; the test selection is unknown"; exit 1 ;;
          esac

      - name: Check results
        shell: bash
        run: |
          # Allowlist, not a failure-blocklist — see docs.yml's `required` job (#1925).
          # Every job in `needs:` above must be checked by *some* step of this
          # job: one that is waited on but never checked is a silent hole
          # (#1944). `changes` is checked by the step above and must NOT be
          # added here — that would give it a `skipped` allowance and restore
          # the defect #1961 fixed.
          for result in "${{ needs.rust-tests.result }}" "${{ needs.python-tests.result }}" \
                        "${{ needs.linux-arm.result }}" "${{ needs.macos-arm.result }}" \
                        "${{ needs.macos-intel.result }}" "${{ needs.tmpdir-symlink.result }}" \
                        "${{ needs.windows.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A test job ended in '$result'; only success or skipped may pass"; exit 1 ;;
            esac
          done
          echo "All jobs passed or were skipped"
