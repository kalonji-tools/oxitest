name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'python/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'pyproject.toml'
              - '.github/**'

  rust-tests:
    name: Rust Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Toolchain comes from rust-toolchain.toml — see that file (#1792).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --group test

      - uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-llvm-cov,cargo-insta

      - name: Check for unreferenced snapshots
        run: cargo insta test --unreferenced=reject

      - name: Rust tests with coverage
        run: cargo llvm-cov --cobertura --output-path cobertura.xml

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-tests:
    name: Test (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      # Toolchain comes from rust-toolchain.toml — see that file (#1792).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ matrix.python-version == '3.12' }}

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          uv-sync-args: --group test

      - name: Build extension
        run: uv run maturin develop

      - name: Python tests
        if: matrix.python-version != '3.12'
        run: uv run python -m oxitest

      - name: Python tests (with coverage)
        if: matrix.python-version == '3.12'
        run: uv run python -m oxitest --cov --cov-report xml

      - name: Upload extension artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: extension-3.12
          path: python/oxitest/_oxitest.cpython-312-*.so
          retention-days: 1

      - name: Upload Python coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Three discrete jobs rather than one matrix. A matrix reports a single
  # aggregate `needs.<job>.result` — see how `python-tests` above, four legs,
  # reaches the rollup below as one string — so per-platform promotion into
  # `needs:` would be impossible. The duplication buys that granularity, and
  # collapsing these back into a matrix silently reverts it (#1944).
  #
  # These test the wheel slices `publish.yml` already ships but has never run:
  # both halves of the macOS `universal2` wheel and the cross-built Linux
  # `aarch64` manylinux wheel. Python 3.12 only — version and platform are
  # orthogonal axes, and four versions are already covered on Linux.
  #
  # Deliberately lighter than the Linux jobs: no `insta --unreferenced`
  # (snapshot hygiene is repo-wide and Linux gates it), no `llvm-cov` or
  # Codecov upload (three more uploads would double-count the same flags),
  # no artifact upload (`extension-3.12` would collide).
  macos-arm:
    name: Test (macOS arm64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Toolchain comes from rust-toolchain.toml — see that file (#1792).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      # Must precede cargo: the crate is `crate-type = ["cdylib"]` with pyo3
      # and no `extension-module` feature, so the `cargo test` harness links
      # libpython and needs an interpreter on disk first (#1944).
      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --group test

      - name: Rust tests
        run: cargo test

      - name: Build extension
        run: uv run maturin develop

      - name: Python tests
        run: uv run python -m oxitest

  macos-intel:
    name: Test (macOS x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --group test

      - name: Rust tests
        run: cargo test

      - name: Build extension
        run: uv run maturin develop

      - name: Python tests
        run: uv run python -m oxitest

  linux-arm:
    name: Test (Linux arm64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --group test

      - name: Rust tests
        run: cargo test

      - name: Build extension
        run: uv run maturin develop

      - name: Python tests
        run: uv run python -m oxitest

  required:
    name: Tests (required)
    # macos-arm and macos-intel are deliberately absent: they are advisory
    # until #1957 lands. Their Python suites fail on one named mechanism —
    # every spawned subprocess inherits a working directory that no longer
    # exists — and promotion is an acceptance criterion on that issue, not
    # this one. Promotion is per-platform so a deferred bug on one target
    # does not hold the others out of the gate (#1944).
    needs: [rust-tests, python-tests, linux-arm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        shell: bash
        run: |
          # Allowlist, not a failure-blocklist — see docs.yml's `required` job (#1925).
          # Every job in `needs:` above must appear here: one that is waited on
          # but never checked is a silent hole (#1944).
          for result in "${{ needs.rust-tests.result }}" "${{ needs.python-tests.result }}" \
                        "${{ needs.linux-arm.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A test job ended in '$result'; only success or skipped may pass"; exit 1 ;;
            esac
          done
          echo "All jobs passed or were skipped"
