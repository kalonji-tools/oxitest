name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'python/**'
              - 'Cargo.*'
              - 'pyproject.toml'
              - '.github/**'

  bridge-sync:
    name: Bridge Sync
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-python

      - name: Check bridge sync
        run: python scripts/check_bridge_sync.py

  rust-tests:
    name: Rust Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --group test

      - name: Rust tests
        run: cargo test

  python-tests:
    name: Test (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ matrix.python-version == '3.12' }}

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          uv-sync-args: ${{ matrix.python-version == '3.12' && '--group coverage' || '--group test' }}

      - name: Build extension
        run: uv run maturin develop

      - name: Python tests
        if: matrix.python-version != '3.12'
        run: PYTHONPATH=python uv run python -m oxitest python/tests/

      - name: Python tests (with coverage)
        if: matrix.python-version == '3.12'
        run: COVERAGE_PROCESS_START=pyproject.toml PYTHONPATH=python:python/tests uv run coverage run -m oxitest python/tests/

      - name: Upload extension artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: extension-3.12
          path: python/oxitest/_oxitest.cpython-312-*.so
          retention-days: 1

      - name: Upload coverage data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-data
          path: .coverage.*
          retention-days: 1
          include-hidden-files: true

  rust-coverage:
    name: Rust Coverage
    needs: rust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false

      - uses: ./.github/actions/setup-python

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-insta

      - name: Check for unreferenced snapshots
        run: cargo insta test --unreferenced=reject

      - name: Run Rust coverage
        run: cargo llvm-cov --cobertura --output-path cobertura.xml

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: cobertura.xml
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-coverage:
    name: Python Coverage
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --only-group coverage

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          name: python-coverage-data

      - name: Generate coverage report
        run: |
          uv run coverage combine
          uv run coverage xml

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  required:
    name: Tests (required)
    needs: [bridge-sync, rust-tests, python-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        shell: bash
        run: |
          if [[ "${{ needs.bridge-sync.result }}" == "failure" || "${{ needs.rust-tests.result }}" == "failure" || "${{ needs.python-tests.result }}" == "failure" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed or were skipped"
