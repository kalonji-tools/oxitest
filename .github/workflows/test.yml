name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'python/**'
              - 'Cargo.*'
              - 'pyproject.toml'
              - '.github/**'

  rust-tests:
    name: Rust Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --group test

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-insta

      - name: Check for unreferenced snapshots
        run: cargo insta test --unreferenced=reject

      - name: Rust tests with coverage
        run: cargo llvm-cov --cobertura --output-path cobertura.xml

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-tests:
    name: Test (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ matrix.python-version == '3.12' }}

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          uv-sync-args: --group test

      - name: Build extension
        run: uv run maturin develop

      - name: Python tests
        if: matrix.python-version != '3.12'
        run: uv run python -m oxitest python/tests/

      - name: Python tests (with coverage)
        if: matrix.python-version == '3.12'
        run: uv run python -m oxitest python/tests/ --cov --cov-report xml

      - name: Upload extension artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: extension-3.12
          path: python/oxitest/_oxitest.cpython-312-*.so
          retention-days: 1

      - name: Upload Python coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  required:
    name: Tests (required)
    needs: [rust-tests, python-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        shell: bash
        run: |
          if [[ "${{ needs.rust-tests.result }}" == "failure" || "${{ needs.python-tests.result }}" == "failure" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed or were skipped"
