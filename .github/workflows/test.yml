name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'python/**'
              - 'Cargo.*'
              - 'pyproject.toml'
              - '.github/**'

  rust-tests:
    name: Rust Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --group test

      - name: Rust tests
        run: cargo test

  python-tests:
    name: Test (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ matrix.python-version == '3.12' }}

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          uv-sync-args: --group test

      - name: Build extension
        run: uv run maturin develop

      - name: Python tests
        run: PYTHONPATH=python uv run python -m oxitest python/tests/

      - name: Upload extension artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: extension-3.12
          path: python/oxitest/_oxitest.cpython-312-*.so
          retention-days: 1

  rust-coverage:
    name: Rust Coverage
    needs: rust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false

      - uses: ./.github/actions/setup-python

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-insta

      - name: Check for unreferenced snapshots
        run: cargo insta test --unreferenced=reject

      - name: Run Rust coverage
        run: cargo llvm-cov --cobertura --output-path cobertura.xml

      - name: Summarise Rust coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: cobertura.xml
          format: markdown
          output: both

      - name: Post Rust coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: rust-coverage
          path: code-coverage-results.md

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: cobertura.xml
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  python-coverage:
    name: Python Coverage
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-python
        with:
          uv-sync-args: --only-group coverage

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: extension-3.12
          path: python/oxitest/

      - name: Run Python coverage
        run: |
          COVERAGE_PROCESS_START=pyproject.toml PYTHONPATH=python:python/tests uv run coverage run -m oxitest python/tests/
          uv run coverage combine
          uv run coverage xml

      - name: Summarise Python coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          format: markdown
          output: both

      - name: Post Python coverage comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: python-coverage
          path: code-coverage-results.md

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  required:
    name: Tests (required)
    needs: [rust-tests, python-tests, rust-coverage, python-coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        shell: bash
        run: |
          if [[ "${{ needs.rust-tests.result }}" == "failure" || "${{ needs.python-tests.result }}" == "failure" || "${{ needs.rust-coverage.result }}" == "failure" || "${{ needs.python-coverage.result }}" == "failure" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed or were skipped"
