[package]
name = "oxitest"
version = "4.0.0"
edition = "2024"
license = "MIT"

[lib]
name = "_oxitest"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29"
ignore = "0.4"
toml = "1.1"
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
thiserror = "2"
globset = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
console = "0.16"
indicatif = "0.18"
indexmap = "2"
miette = { version = "7", features = ["fancy-no-backtrace"] }
parking_lot = "0.12"
ahash = { version = "0.8", features = ["serde"] }
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
camino = { version = "1", features = ["serde1"] }
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
rand = "0.10.1"
similar = "3"
quick-xml = { version = "0.42", features = ["serialize"] }
rustpython-parser = "0.4"
rayon = "1"
regex = "1"

[dev-dependencies]
# `in_memory` gives `InMemoryTerm`, the only way to assert on what a
# `ProgressStyle` actually renders — `with_template` does not validate
# placeholders, so rendering is the only place a mistyped one is caught (#1832).
# A dev-dependency, so resolver v3 keeps the feature out of release builds.
indicatif = { version = "0.18", features = ["in_memory"] }
tempfile = "3"
assert_fs = "1"
insta = { version = "1", features = ["redactions"] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
# `priority = -1` is mandatory: cargo refuses to build when a group and a
# specific lint share the default priority of 0.
all = { level = "deny", priority = -1 }
# Nursery, so `all` misses it. `deny` not `warn` — `warnings = "deny"` above
# escalates either spelling to an error anyway (measured, #1817).
redundant_clone = "deny"
# `restriction` group, so `all` misses these too. All four measured at zero hits
# on `main` — ratchets against new code, not a cleanup. `exit` is the
# load-bearing one: it keeps `std::process::exit` from silently bypassing the
# semver-protected exit-code contract and the `ExitVote` mechanism (#1829).
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
# Restriction, so `all` misses it. A `panic!` on the shipping path aborts the
# user's test run with a backtrace instead of an `ExitCode`/`Diagnostic`. Zero
# shipping sites today (#1830) — `allow-panic-in-tests` in `clippy.toml` exempts
# the 190 legitimate ones in tests, so this is a ratchet, not a cleanup.
panic = "deny"
# Restriction, so `all` misses these three too. They close the remaining
# spellings of "abort here"; leaving any open makes the `panic` deny above
# cosmetic. Rule, exceptions and growth process:
# `docs/adr/0011-no-unhandled-panic-routes.md`. Per-site `#[allow]` is banned
# there — a stubborn site gets restructured (#1832).
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
# Pedantic, so `all` misses this one too — verified against clippy 0.1.94's own
# `-Whelp` group listing, not assumed from the lint's category history, which
# has moved it between `style` and `pedantic` more than once. `deny` for the
# same reason as above.
uninlined_format_args = "deny"
# Nursery too (measured: `-W clippy::nursery` fires it, `pedantic` does not), so
# `all` misses it as well. `deny` for the same reason as above (#1835).
use_self = "deny"
# Pedantic, so `all` misses this one too. The Rust API docs became a CI-gated
# artifact in #1813 (`cargo doc` in preflight), so their legibility is shipped
# output rather than a private convenience. `doc-valid-idents` in `clippy.toml`
# is what keeps this from backticking prose — without it the lint makes docs
# worse, so the two changes are a pair (#1836).
doc_markdown = "deny"
# Nursery, so `all` misses it (verified against clippy 0.1.97's own `-Whelp`
# group listing). Not a mechanisation of ADR-0005 — that ADR governs
# `python/oxitest/` only, and its `&mut` notation describes Python mutability.
# The motive is a measured gap: `all` already denies `unnecessary_mut_passed`
# and `unused_mut`, which catch an over-broad `&mut` at the *call site*, while
# nothing catches the *declaration* that over-claims. All three sites this
# closed arose that way (#1833).
needless_pass_by_ref_mut = "deny"
# Nursery, so `all` misses it (verified against clippy 0.1.97's `-Whelp` group
# listing). #1837 proposed rejecting this because `const` ratchets a semver
# promise; it does not. `crate-type = ["cdylib"]` means no Rust crate can depend
# on this one, and `stability.md` names "Internal module structure and Rust crate
# layout" under "no guarantee" — so there is no surface to promise anything
# about. A ratchet against new code, not a cleanup (#1837).
missing_const_for_fn = "deny"
# Nursery, so `all` misses it (verified against clippy 0.1.97's `-Whelp` group
# listing). Inside a non-`pub` module `pub` and `pub(crate)` are the same
# effective visibility, and no module in this crate is `pub` — none ever has
# been, across 1758 commits — so the qualifier was uniformly redundant. Nothing
# outside can observe either spelling: `crate-type = ["cdylib"]` means no Rust
# crate can depend on this one. One site keeps `pub(crate)` behind an `#[allow]`
# because a Python script parses it as text; see `worker_result/wire.rs` (#1838).
redundant_pub_crate = "deny"
