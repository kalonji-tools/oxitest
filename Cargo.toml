[package]
name = "oxitest"
version = "3.0.0"
edition = "2024"
license = "MIT"

[lib]
name = "_oxitest"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29"
ignore = "0.4"
toml = "1.1"
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
thiserror = "2"
globset = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
console = "0.16"
indicatif = "0.18"
indexmap = "2"
miette = { version = "7", features = ["fancy-no-backtrace"] }
parking_lot = "0.12"
ahash = { version = "0.8", features = ["serde"] }
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
camino = { version = "1", features = ["serde1"] }
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
rand = "0.10.1"
similar = "3"
quick-xml = { version = "0.41", features = ["serialize"] }
rustpython-parser = "0.4"
rayon = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
insta = { version = "1", features = ["redactions"] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
# `priority = -1` is mandatory: cargo refuses to build when a group and a
# specific lint share the default priority of 0.
all = { level = "deny", priority = -1 }
# Nursery, so `all` misses it. `deny` not `warn` — `warnings = "deny"` above
# escalates either spelling to an error anyway (measured, #1817).
redundant_clone = "deny"
# `restriction` group, so `all` misses these too. All four measured at zero hits
# on `main` — ratchets against new code, not a cleanup. `exit` is the
# load-bearing one: it keeps `std::process::exit` from silently bypassing the
# semver-protected exit-code contract and the `ExitVote` mechanism (#1829).
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
# Restriction, so `all` misses it. A `panic!` on the shipping path aborts the
# user's test run with a backtrace instead of an `ExitCode`/`Diagnostic`. Zero
# shipping sites today (#1830) — `allow-panic-in-tests` in `clippy.toml` exempts
# the 190 legitimate ones in tests, so this is a ratchet, not a cleanup.
panic = "deny"
# Pedantic, so `all` misses this one too — verified against clippy 0.1.94's own
# `-Whelp` group listing, not assumed from the lint's category history, which
# has moved it between `style` and `pedantic` more than once. `deny` for the
# same reason as above.
uninlined_format_args = "deny"
