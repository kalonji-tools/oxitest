# The project status is deliberately absent (ADR-0019, #2176). Coverage is a
# report; the obligation record refuses instead. A control of one file and one
# test whose body is `assert True` scores 24.1% against the denominator codecov
# uses, because oxitest runs its own suite and the harness executes product code
# no test observes — so an 80% project target sat on a scale whose zero is 24.1%.
#
# Patch coverage stays. It measures the lines a pull request adds, so the floor
# above does not inflate it.
coverage:
  status:
    patch:
      rust:
        target: 80%
        flags: [rust]
      python:
        target: 80%
        flags: [python]

flags:
  rust:
    paths: [src/]
    carryforward: true
  python:
    paths: [python/oxitest/]
    carryforward: true

# Emitted by scripts/check_coverage_record.py from scripts/coverage_record.tsv.
# Do not edit by hand — `just check` refuses when the two disagree.
# A region is here because the record says `exempt`: the instrument that
# reads it cannot enter it, so its lines distort the denominator. A region
# the record calls `uncovered` is NOT here — it is real untested product
# code and the report should say so.
ignore:
  - "src/bridge.rs"
  - "src/cache/mod.rs"
  - "src/config/cli/inspect.rs"
  - "src/config/cli/query.rs"
  - "src/config/mod.rs"
  - "src/doctest/mod.rs"
  - "src/inspect/graph/nodes.rs"
  - "src/inspect/overview.rs"
  - "src/lib.rs"
  - "src/parallel/drain.rs"
  - "src/query/ast.rs"
  - "src/query/bridge.rs"
  - "src/reporter/bridge.rs"
  - "src/reporter/format/mod.rs"
  - "src/reporter/mod.rs"
  - "src/types/mod.rs"
  - "src/worker_result/mod.rs"
