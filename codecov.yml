coverage:
  status:
    project:
      rust:
        target: 80%
        flags: [rust]
      python:
        target: 80%
        flags: [python]
    patch:
      rust:
        target: 80%
        flags: [rust]
      python:
        target: 80%
        flags: [python]

flags:
  rust:
    paths: [src/]
    carryforward: true
  python:
    paths: [python/oxitest/]
    carryforward: true

ignore:
  # Rust: PyO3 entry points — only testable through Python integration tests
  - "src/assert_rewriter.rs"
  - "src/bridge.rs"
  - "src/query/bridge.rs"
  - "src/reporter/bridge.rs"
  - "src/lib.rs"
  # Pipeline orchestration: only exercised through Python integration tests (subprocess)
  - "src/pipeline/mod.rs"
  - "src/pipeline/transitions/"
  - "src/pipeline/execution.rs"
  # collect_items() takes Python<'_> + a live FixtureSession and is reachable
  # only from transitions/session_ready.rs, so `cargo llvm-cov` (which runs
  # cargo test alone) can never enter it. Its behaviour is covered end to end
  # by python/tests/test_fixtures_redesign_slice1.py, which drives the runner
  # as a subprocess and contributes nothing to the Rust flag.
  - "src/pipeline/collection.rs"
  # init_session() meets the same criteria as collection.rs above: it takes
  # Python<'_>, calls FixtureSession::new (which imports oxitest into the
  # interpreter), and is reachable only from transitions/session_ready.rs.
  # Listed after #1780, when a one-argument change caused `cargo fmt` to reflow
  # the surrounding match block — re-stamping eleven already-uncovered lines as
  # "added" and dropping patch coverage to 53% with no change in tested
  # behaviour. Reflow of untestable code should not read as coverage rot.
  - "src/pipeline/helpers.rs"
  # Python: only exercised through the Rust pipeline, not by Python unit tests
  - "python/oxitest/_bridge/worker.py"
  - "python/oxitest/__main__.py"
  - "python/oxitest/__init__.py"
  # Fixture internals: exercised via fixtures.py re-exports, not directly by test imports
  - "python/oxitest/_bridge/_fixture_registry.py"
  - "python/oxitest/_bridge/_fixture_session.py"
  # Plugin loader: bridge-layer orchestration exercised via subprocess integration tests
  - "python/oxitest/_bridge/plugin_loader.py"
  # Middleware internals: async paths run inside asyncio.run(), plugin paths need real plugins
  - "python/oxitest/_bridge/_middleware.py"
  # Protocol stubs — method bodies are `...`, never executed
  - "python/oxitest/plugin.py"
  - "python/oxitest/_bridge/_async_backend.py"
  # Import graph: only called from Rust via --affected, has own test suite
  - "python/oxitest/_bridge/import_graph.py"
  # Query bridge: only called from Rust pipeline, uses simple dict returns (no typed wire format)
  - "python/oxitest/_bridge/query_bridge.py"
