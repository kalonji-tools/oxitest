# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer", exclude = "\\.snap$" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["-b", "main"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff"
name = "ruff check"
language = "system"
entry = "ruff check --fix"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "ruff format"
types = ["python"]

[[repos.hooks]]
id = "ty"
name = "ty check"
language = "system"
entry = "ty check"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "codespell"
name = "codespell"
language = "system"
entry = "codespell"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt"
pass_filenames = false
files = "\\.rs$"

# The four `stages = ["pre-push"]` hooks below are run by CI, at
# `.github/workflows/quality.yml`'s `prek run --all-files --stage pre-push` step.
# No pre-push shim is installed locally, on purpose: `just preflight` is the
# mandated local gate and already covers them, so a shim would make every
# compliant push repeat that work (#1823).
[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --all-targets -- -D warnings"
pass_filenames = false
files = "\\.rs$"
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-doc"
name = "cargo doc"
language = "system"
# No `-D` flag: `[lints.rust] warnings = "deny"` in Cargo.toml already implies
# `-D rustdoc::broken-intra-doc-links`, so a stale link is an error here.
entry = "cargo doc --no-deps --document-private-items"
pass_filenames = false
files = "\\.rs$"
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-check"
name = "cargo check"
language = "system"
entry = "cargo check"
pass_filenames = false
files = "\\.rs$"

[[repos.hooks]]
id = "uv-lock-check"
name = "uv lock --check"
language = "system"
entry = "uv lock --check"
pass_filenames = false
files = "(pyproject\\.toml|uv\\.lock)$"
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-lock-check"
name = "cargo metadata --locked"
language = "system"
# Not `cargo update --locked`: that asserts every dependency is pinned to its
# newest compatible release, which any upstream publish falsifies without this
# repo changing. `cargo metadata --locked` asserts what the hook name promises —
# that Cargo.lock satisfies Cargo.toml — mirroring `uv lock --check` above.
entry = "cargo metadata --locked --format-version 1 --quiet"
pass_filenames = false
files = "(Cargo\\.toml|Cargo\\.lock)$"
stages = ["pre-push"]

[[repos.hooks]]
id = "bridge-sync"
name = "bridge-sync"
language = "system"
entry = "python scripts/check_bridge_sync.py"
pass_filenames = false
files = "(bridge\\.rs|worker_result\\.rs|result\\.py|worker\\.py)$"

[[repos.hooks]]
id = "platform-sets"
name = "platform sets"
language = "system"
# Three files encode the platform set — the required rollup in test.yml, the
# wheel targets in publish.yml, and `classifiers` — and nothing compared them,
# so they disagreed three ways (#1946). ADR-0013 makes the tested set the
# definition; this holds the derivation.
#
# No `stages:` key, so it also runs in CI.
entry = "python scripts/check_platform_sets.py"
pass_filenames = false
# The checker's own file is in the list because PLATFORMS holds ADR-0013
# Rule 3: a commit that edits only the table is a commit that changes the
# decision, and without this entry the hook does not run on it.
files = "^(\\.github/workflows/(test|publish)\\.ya?ml|pyproject\\.toml|scripts/check_platform_sets\\.py)$"

[[repos.hooks]]
id = "subprocess-encoding"
name = "subprocess encoding"
language = "system"
# A text-mode subprocess call with no `encoding=` decodes with the locale
# codec, which is cp1252 on Windows — and oxitest's own separator rule
# contains a byte it cannot decode. 292 red tests, 0 assertion failures
# (#1951, #1986). Ruff has no rule for this as of 0.15.16.
#
# No `stages:` key, so it also runs in CI.
entry = "python scripts/check_subprocess_encoding.py"
pass_filenames = false
files = "^(python|scripts)/.*\\.py$"

[[repos.hooks]]
id = "justfile-quoting"
name = "justfile quoting"
language = "system"
# `'{{ x }}'` and `"{{ x }}"` do not quote a just substitution — they put the
# value between two quote characters, so a quote of the same kind inside the
# value closes the pair early. The value is then silently altered, or the recipe
# dies on the remainder (#2015). The justfile is otherwise ungated entirely.
#
# No `stages:` key, so it also runs in CI.
entry = "python scripts/check_justfile_quoting.py"
pass_filenames = false
files = "^justfile$"

# Fetched by prek, not taken from `devenv.nix`: the CI job that runs prek installs
# prek and nothing else, so a `language = "system"` hook would find no binary.
# Upstream's manifest scopes itself to `^\.github/workflows/`, which is what keeps
# it off `.github/actions/` — it reads a composite as a workflow and reports five
# spurious syntax errors (#1974).
#
# A hook declaring no `stages:` runs at every stage, so both hooks here get local
# pre-commit coverage *and* both of quality.yml's prek steps. The pre-push stage
# is CI-only by design, so a hook that must also run locally declares no stage.
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]
