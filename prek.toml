# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer", exclude = "\\.snap$" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["-b", "main"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff"
name = "ruff check"
language = "system"
entry = "ruff check --fix"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "ruff format"
types = ["python"]

[[repos.hooks]]
id = "ty"
name = "ty check"
language = "system"
entry = "ty check"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "codespell"
name = "codespell"
language = "system"
entry = "codespell"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt"
pass_filenames = false
files = "\\.rs$"

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --all-targets -- -D warnings"
pass_filenames = false
files = "\\.rs$"
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-doc"
name = "cargo doc"
language = "system"
# No `-D` flag: `[lints.rust] warnings = "deny"` in Cargo.toml already implies
# `-D rustdoc::broken-intra-doc-links`, so a stale link is an error here.
entry = "cargo doc --no-deps --document-private-items"
pass_filenames = false
files = "\\.rs$"
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-check"
name = "cargo check"
language = "system"
entry = "cargo check"
pass_filenames = false
files = "\\.rs$"

[[repos.hooks]]
id = "uv-lock-check"
name = "uv lock --check"
language = "system"
entry = "uv lock --check"
pass_filenames = false
files = "(pyproject\\.toml|uv\\.lock)$"
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-lock-check"
name = "cargo metadata --locked"
language = "system"
# Not `cargo update --locked`: that asserts every dependency is pinned to its
# newest compatible release, which any upstream publish falsifies without this
# repo changing. `cargo metadata --locked` asserts what the hook name promises —
# that Cargo.lock satisfies Cargo.toml — mirroring `uv lock --check` above.
entry = "cargo metadata --locked --format-version 1 --quiet"
pass_filenames = false
files = "(Cargo\\.toml|Cargo\\.lock)$"
stages = ["pre-push"]

[[repos.hooks]]
id = "check-tag-version"
name = "tag matches Cargo.toml version"
language = "system"
entry = "bash scripts/check-tag-version.sh"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "bridge-sync"
name = "bridge-sync"
language = "system"
entry = "python scripts/check_bridge_sync.py"
pass_filenames = false
files = "(bridge\\.rs|worker_result\\.rs|result\\.py|worker\\.py)$"

[[repos.hooks]]
id = "affected-tests"
name = "affected tests"
language = "system"
entry = "bash -c 'PYTHONPATH=python uv run python -m oxitest --affected'"
pass_filenames = false
stages = ["pre-push"]

# actionlint is fetched by prek rather than taken from `devenv.nix`, because the
# CI job that runs prek installs prek and nothing else — a `language = "system"`
# hook would find no binary there. Upstream's manifest already scopes itself to
# `^\.github/workflows/`, which is what keeps it away from `.github/actions/`:
# pointed at a composite `action.yml` it reports five spurious syntax errors,
# because it parses one as a workflow missing its `jobs` and `on` sections.
#
# No `stages:` key: a hook declaring none runs at every stage, so this gets local
# pre-commit coverage *and* both of quality.yml's prek invocations, which sidesteps
# the inert local pre-push tier (#1823).
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]
