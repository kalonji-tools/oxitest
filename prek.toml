# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer", exclude = "\\.snap$" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["-b", "main"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff"
name = "ruff check"
language = "system"
entry = "ruff check --fix"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "ruff format"
types = ["python"]

[[repos.hooks]]
id = "ty"
name = "ty check"
language = "system"
entry = "ty check"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "codespell"
name = "codespell"
language = "system"
entry = "codespell"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt"
pass_filenames = false
files = "\\.rs$"

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --all-targets -- -D warnings"
pass_filenames = false
files = "\\.rs$"
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-doc"
name = "cargo doc"
language = "system"
# No `-D` flag: `[lints.rust] warnings = "deny"` in Cargo.toml already implies
# `-D rustdoc::broken-intra-doc-links`, so a stale link is an error here.
entry = "cargo doc --no-deps --document-private-items"
pass_filenames = false
files = "\\.rs$"
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-check"
name = "cargo check"
language = "system"
entry = "cargo check"
pass_filenames = false
files = "\\.rs$"

[[repos.hooks]]
id = "uv-lock-check"
name = "uv lock --check"
language = "system"
entry = "uv lock --check"
pass_filenames = false
files = "(pyproject\\.toml|uv\\.lock)$"
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-lock-check"
name = "cargo metadata --locked"
language = "system"
# Not `cargo update --locked`: that asserts every dependency is pinned to its
# newest compatible release, which any upstream publish falsifies without this
# repo changing. `cargo metadata --locked` asserts what the hook name promises —
# that Cargo.lock satisfies Cargo.toml — mirroring `uv lock --check` above.
entry = "cargo metadata --locked --format-version 1 --quiet"
pass_filenames = false
files = "(Cargo\\.toml|Cargo\\.lock)$"
stages = ["pre-push"]

[[repos.hooks]]
id = "check-tag-version"
name = "tag matches Cargo.toml version"
language = "system"
entry = "bash scripts/check-tag-version.sh"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "bridge-sync"
name = "bridge-sync"
language = "system"
entry = "python scripts/check_bridge_sync.py"
pass_filenames = false
files = "(bridge\\.rs|worker_result\\.rs|result\\.py|worker\\.py)$"

[[repos.hooks]]
id = "rollup-agreement"
name = "rollup agreement"
language = "system"
# The direction actionlint cannot see: it types the `needs` context *from* the
# `needs:` list, so it owns referenced-but-undeclared and is silent on
# declared-but-unreferenced. Mutation-tested both ways (#1974).
#
# No `stages:` key, so it also runs in CI — see the actionlint repo below.
entry = "python scripts/check_rollup_agreement.py"
pass_filenames = false
files = "^\\.github/workflows/.*\\.ya?ml$"

[[repos.hooks]]
id = "subprocess-encoding"
name = "subprocess encoding"
language = "system"
# A text-mode subprocess call with no `encoding=` decodes with the locale
# codec, which is cp1252 on Windows — and oxitest's own separator rule
# contains a byte it cannot decode. 292 red tests, 0 assertion failures
# (#1951, #1986). Ruff has no rule for this as of 0.15.16.
#
# No `stages:` key, so it also runs in CI.
entry = "python scripts/check_subprocess_encoding.py"
pass_filenames = false
files = "^(python|scripts)/.*\\.py$"

[[repos.hooks]]
id = "affected-tests"
name = "affected tests"
language = "system"
entry = "bash -c 'PYTHONPATH=python uv run python -m oxitest --affected'"
pass_filenames = false
stages = ["pre-push"]

# Fetched by prek, not taken from `devenv.nix`: the CI job that runs prek installs
# prek and nothing else, so a `language = "system"` hook would find no binary.
# Upstream's manifest scopes itself to `^\.github/workflows/`, which is what keeps
# it off `.github/actions/` — it reads a composite as a workflow and reports five
# spurious syntax errors (#1974).
#
# A hook declaring no `stages:` runs at every stage, so both hooks here get local
# pre-commit coverage *and* both of quality.yml's prek steps, sidestepping the
# inert local pre-push tier (#1823).
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]
