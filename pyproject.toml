[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "oxitest"
dynamic = ["version"]
requires-python = ">=3.11"
description = "A fast Python test runner written in Rust"
license = { text = "MIT" }

[project.scripts]
oxitest = "oxitest:main"

[tool.maturin]
module-name = "oxitest._oxitest"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ── Formatter conflicts ──────────────────────────────────────────────
    "COM812",         # trailing comma — conflicts with ruff formatter
    "ISC001",         # implicit string concat — conflicts with ruff formatter

    # ── Docstring style conflicts ────────────────────────────────────────
    "D203",           # blank line before class docstring — conflicts with D211
    "D213",           # multi-line summary second line — conflicts with D212

    # ── Intentional design decisions ─────────────────────────────────────
    "TC001",          # get_type_hints() resolves annotations at runtime — imports must stay
    "TC002",          # same: runtime annotation resolution needs imports in namespace
    "TC003",          # same: stdlib types used in annotations resolved by get_type_hints()

    # ── Not yet addressed (TODO: fix incrementally) ──────────────────────
    "ANN401",         # dynamically typed expressions (Any) — legitimately Any in fixture/plugin system
]

[tool.ruff.lint.per-file-ignores]
"python/oxitest/_bridge/worker.py" = ["T201", "PLC0415"]
"python/oxitest/_bridge/_builtins/_capture.py" = ["T201", "SIM115"]
"python/tests/*" = [
    "T201", "B010", "B017", "B018", "B028",
    "PLR2004",  # magic values in comparisons
    "PT015",    # assert always fails
    "PT017",    # assert in except block
    "PT018",    # composite assert
    "S108",     # insecure temp file usage
    "S603",     # subprocess call
    "S607",     # partial executable path
    "PLW1510",  # subprocess.run without check
    "PLW0177",  # comparison with NaN
    "N818",     # exception name suffix (test doubles named Skipped etc.)
    "TRY301",   # raise within try (testing exception handling)
    "INP001",   # no __init__.py (test dirs are not packages)
    "S102",     # exec() needed to test AST rewriter and live type annotations
    "PLR0913",  # test helpers and parametrized tests have many params by nature
    "PLC0415",  # lazy imports in tests (each test imports what it tests)
    "PT019",    # underscore-prefixed fixture params (oxitest, not pytest — rule doesn't apply)
    "ARG002",   # unused method args in protocol test doubles (structural conformance)
    "SLF001",   # tests legitimately inspect private state to verify internals
    "S101",     # assert is the primary assertion mechanism in tests
]
"python/oxitest/_bridge/_debugger.py" = ["T100"]
"scripts/*" = ["T201"]
"benchmarks/*.py" = ["T201", "E501", "PLR2004", "S101"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python = ".venv"
extra-paths = ["python/tests"]

[tool.oxitest]
testpaths = ["python/tests", "python/oxitest"]
python_files = ["test_*.py"]
strict = "abort"
timeout = 30
affected_base = "main"
doctest_modules = true

[tool.coverage.run]
source = ["python/oxitest"]
parallel = true

[tool.coverage.paths]
source = ["python/oxitest"]

[tool.codespell]
skip = "target,Cargo.lock,devenv.lock,*.min.js,graphify-out,./docs/site,./docs/internals/book"
ignore-words-list = "NotIn,ser,sotre,ratatui"

[dependency-groups]
build = [
    "maturin>=1.7,<2",
]
test = [
    { include-group = "build" },
    "coverage>=7",
]
lint = [
    "ruff>=0.4",
    "codespell>=2",
]
typecheck = [
    "ty",
]
docs = [
    "mkdocs-material>=9",
    "mkdocs-awesome-pages-plugin>=2.10",
    "mkdocs-git-revision-date-localized-plugin>=1",
    "mkdocs-minify-plugin>=0.7",
    "mkdocstrings[python]>=0.24",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "docs" },
]
