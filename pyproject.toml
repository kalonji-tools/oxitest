[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "oxitest"
dynamic = ["version"]
requires-python = ">=3.11"
description = "A fast Python test runner written in Rust"
license = { text = "MIT" }

[project.scripts]
oxitest = "oxitest:main"

[tool.maturin]
module-name = "oxitest._oxitest"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ── Formatter conflicts ──────────────────────────────────────────────
    "COM812",         # trailing comma — conflicts with ruff formatter
    "ISC001",         # implicit string concat — conflicts with ruff formatter

    # ── Docstring style conflicts ────────────────────────────────────────
    "D203",           # blank line before class docstring — conflicts with D211
    "D213",           # multi-line summary second line — conflicts with D212

    # ── Intentional design decisions ─────────────────────────────────────
    "A002",           # shadowing builtins (abs param in approx is intentional API)
    "B009", "B010",   # getattr/setattr used intentionally for ty compatibility
    "B015",           # pointless comparison (intentional in raises() context)
    "D105", "D107",   # missing docstring in magic method / __init__
    "ERA001",         # commented-out code (algorithm explanations, not dead code)
    "PLC0414",        # re-export aliases (Foo as Foo) are intentional public API
    "PLR0911",        # too many return statements (complex dispatchers)
    "RUF006",         # asyncio dangling task (intentional in leak-detection tests)
    "FBT002",         # boolean default value (intentional API: show_locals=False)
    "S102",           # exec() used intentionally (module loader, test helpers)
    "S112",           # try-except-continue (intentional fallback in diagnostics)
    "T100",           # debugger breakpoint (intentional in _debugger.py)
    "TRY203",         # re-raise in except (intentional propagation e.g. bdb.BdbQuit)
    "TRY300",         # return in try (acceptable pattern in loaders)

    # ── Not yet addressed (TODO: fix incrementally) ──────────────────────
    "ANN001",         # missing type annotation for function argument
    "ANN002",         # missing type annotation for *args
    "ANN201",         # missing return type annotation for public function
    "ANN202",         # missing return type annotation for private function
    "ANN401",         # dynamically typed expressions (Any) disallowed
    "ARG001",         # unused function argument
    "ARG002",         # unused method argument
    "ARG005",         # unused lambda argument
    "BLE001",         # blind exception catch
    "C901",           # function too complex
    "EM101",          # exception must not use string literal
    "EM102",          # exception must not use f-string literal
    "FBT001",         # boolean positional arg in function def
    "INP001",         # missing __init__.py (implicit namespace package)
    "N806",           # variable in function should be lowercase
    "PLC0415",        # import outside top-level
    "PLR0912",        # too many branches
    "PLR0913",        # too many arguments
    "PLR0915",        # too many statements
    "PLR2004",        # magic value in comparison
    "S101",           # use of assert
    "SLF001",         # private member access
    "TC001",          # move app import into TYPE_CHECKING
    "TC002",          # move third-party import into TYPE_CHECKING
    "TC003",          # move stdlib import into TYPE_CHECKING
    "TRY003",         # long exception message outside exception class
    "TRY301",         # raise within try
]

[tool.ruff.lint.per-file-ignores]
"python/oxitest/_bridge/worker.py" = ["T201", "D"]
"python/oxitest/_bridge/_builtins/_capture.py" = ["T201", "SIM115"]
"python/oxitest/_bridge/_*.py" = ["D100", "D101", "D102", "D103", "D104"]
"python/tests/*" = [
    "T201", "B011", "B017", "B018", "B028", "C408", "SIM117", "PTH109", "D",
    "PLR2004",  # magic values in comparisons
    "PT015",    # assert always fails
    "PT017",    # assert in except block
    "PT018",    # composite assert
    "S108",     # insecure temp file usage
    "S603",     # subprocess call
    "S607",     # partial executable path
    "PLW1510",  # subprocess.run without check
    "PLW0177",  # comparison with NaN
    "N818",     # exception name suffix (test doubles named Skipped etc.)
    "FBT003",   # boolean positional value in function call
]
"scripts/*" = ["T201", "D"]
"benchmarks/*.py" = ["T201", "E501", "D", "PLR2004", "S101"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python = ".venv"
extra-paths = ["python/tests"]

[tool.oxitest]
testpaths = ["python/tests", "python/oxitest"]
python_files = ["test_*.py"]
strict = "abort"
timeout = 30
affected_base = "main"
doctest_modules = true

[tool.coverage.run]
source = ["python/oxitest"]
parallel = true

[tool.coverage.paths]
source = ["python/oxitest"]

[tool.codespell]
skip = "target,Cargo.lock,devenv.lock,*.min.js,graphify-out,./docs/site,./docs/internals/book"
ignore-words-list = "NotIn,ser,sotre,ratatui"

[dependency-groups]
build = [
    "maturin>=1.7,<2",
]
test = [
    { include-group = "build" },
    "coverage>=7",
]
lint = [
    "ruff>=0.4",
    "codespell>=2",
]
typecheck = [
    "ty",
]
docs = [
    "mkdocs-material>=9",
    "mkdocs-awesome-pages-plugin>=2.10",
    "mkdocs-git-revision-date-localized-plugin>=1",
    "mkdocs-minify-plugin>=0.7",
    "mkdocstrings[python]>=0.24",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "docs" },
]
