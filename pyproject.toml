[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "oxitest"
dynamic = ["version"]
requires-python = ">=3.11"
description = "A fast Python test runner written in Rust"
license = { text = "MIT" }

[project.scripts]
oxitest = "oxitest:main"

[tool.maturin]
module-name = "oxitest._oxitest"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ── Formatter conflicts ──────────────────────────────────────────────
    "COM812",         # trailing comma — conflicts with ruff formatter
    "ISC001",         # implicit string concat — conflicts with ruff formatter

    # ── Docstring style conflicts ────────────────────────────────────────
    "D203",           # blank line before class docstring — conflicts with D211
    "D213",           # multi-line summary second line — conflicts with D212

    # ── Intentional design decisions ─────────────────────────────────────
    "TC001",          # get_type_hints() resolves annotations at runtime — imports must stay
    "TC002",          # same: runtime annotation resolution needs imports in namespace
    "TC003",          # same: stdlib types used in annotations resolved by get_type_hints()

    # ── Not yet addressed (TODO: fix incrementally) ──────────────────────
    "ANN401",         # dynamically typed expressions (Any) — legitimately Any in fixture/plugin system
]

[tool.ruff.lint.per-file-ignores]
# ── Source code ─────────────────────────────────────────────────────────
"python/oxitest/_bridge/worker.py" = ["PLC0415"]

# ── Test infrastructure ─────────────────────────────────────────────────
"python/tests/*" = [
    "PLR2004",  # magic values in comparisons — universal in test assertions
    "S101",     # assert is the primary assertion mechanism in tests
    "INP001",   # no __init__.py (test dirs are not packages)
]

# ── ARG002: unused method args in protocol test doubles ─────────────────
"python/tests/fixtures/oxitest_sample_infra/_plugin.py" = ["ARG002"]
"python/tests/fixtures/oxitest_sample_metrics/_plugin.py" = ["ARG002"]
"python/tests/test_builtins.py" = ["ARG002", "PT019", "SLF001"]
"python/tests/test_coverage.py" = ["ARG002", "SLF001"]
"python/tests/test_fixture_instantiator.py" = ["ARG002", "SLF001"]
"python/tests/test_fixture_session.py" = ["ARG002"]
"python/tests/test_fixtures.py" = ["ARG002", "SLF001"]
"python/tests/test_importer.py" = ["ARG002", "S102"]
"python/tests/test_middleware.py" = ["ARG002"]
"python/tests/test_plugin_lazy.py" = ["ARG002"]
"python/tests/test_plugin_loader.py" = ["ARG002"]

# ── SLF001: tests legitimately inspect private state ────────────────────
"python/tests/test_async_fixtures.py" = ["SLF001"]
"python/tests/test_debug.py" = ["SLF001"]
"python/tests/test_exception_handlers.py" = ["SLF001"]
"python/tests/test_helper_provider.py" = ["SLF001"]
"python/tests/test_helpers_registrar.py" = ["SLF001"]
"python/tests/test_middleware_builder.py" = ["SLF001"]
"python/tests/test_plugin_two_phase.py" = ["SLF001"]

# ── PLC0415: intentionally lazy imports ─────────────────────────────────
"python/tests/fixtures/oxitest_sample_infra/__init__.py" = ["PLC0415"]
"python/tests/fixtures/oxitest_sample_metrics/__init__.py" = ["PLC0415"]
"python/tests/test_timeout.py" = ["PLC0415"]

# ── S102: exec() required for AST-rewritten module loading ──────────────
"python/tests/test_assert_error.py" = ["S102"]

# ── S603: subprocess calls in test infrastructure ───────────────────────
"python/tests/conftest.py" = ["S603"]
"python/tests/integration/*" = ["S603"]
"python/tests/test_worker.py" = ["S603"]

# ── PT019: pytest.raises without match — intentional ────────────────────
"python/tests/integration/test_completions.py" = ["PT019"]
"python/tests/integration/test_version.py" = ["PT019"]
"python/tests/test_conftest_loader.py" = ["PT019"]
"python/tests/test_loader.py" = ["PT019"]
"python/tests/test_read_fixtures.py" = ["PT019"]

# ── Scripts and benchmarks ──────────────────────────────────────────────
"scripts/*" = ["T201"]
"benchmarks/*.py" = ["T201", "E501", "PLR2004", "S101"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python = ".venv"
extra-paths = ["python/tests"]

[tool.oxitest]
testpaths = ["python/tests", "python/oxitest"]
python_files = ["test_*.py"]
strict = "abort"
timeout = 30
affected_base = "main"
doctest_modules = true

[tool.coverage.run]
source = ["python/oxitest"]
parallel = true

[tool.coverage.paths]
source = ["python/oxitest"]

[tool.codespell]
skip = "target,Cargo.lock,devenv.lock,*.min.js,graphify-out,./docs/site,./docs/internals/book"
ignore-words-list = "NotIn,ser,sotre,ratatui"

[dependency-groups]
build = [
    "maturin>=1.7,<2",
]
test = [
    { include-group = "build" },
    "coverage>=7",
]
lint = [
    "ruff>=0.4",
    "codespell>=2",
]
typecheck = [
    "ty",
]
docs = [
    "mkdocs-material>=9",
    "mkdocs-awesome-pages-plugin>=2.10",
    "mkdocs-git-revision-date-localized-plugin>=1",
    "mkdocs-minify-plugin>=0.7",
    "mkdocstrings[python]>=0.24",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "docs" },
]
