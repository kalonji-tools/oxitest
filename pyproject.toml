[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "oxitest"
dynamic = ["version"]
requires-python = ">=3.11"
description = "A fast Python test runner written in Rust"
license = { text = "MIT" }

[project.scripts]
oxitest = "oxitest:main"

[tool.maturin]
module-name = "oxitest._oxitest"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20", "A", "C4", "SIM", "RET", "PTH", "PERF"]
ignore = ["B009", "B010"]  # getattr/setattr used intentionally for ty compatibility

[tool.ruff.lint.per-file-ignores]
"python/oxitest/_bridge/worker.py" = ["T201"]
"python/oxitest/_bridge/_builtins/_capture.py" = ["T201", "SIM115"]
"python/tests/*" = ["T201", "B011", "B017", "B018", "B028", "C408", "SIM117", "PTH109"]
"scripts/*" = ["T201"]
"bench/*.py" = ["T201", "E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.environment]
python = ".venv"

[tool.oxitest]
testpaths = ["python/tests"]
strict = "abort"

[tool.codespell]
skip = "target,Cargo.lock,flake.lock"
ignore-words-list = "NotIn"

[dependency-groups]
build = [
    "maturin>=1.7,<2",
]
test = [
    { include-group = "build" },
]
lint = [
    "ruff>=0.4",
    "codespell>=2",
]
typecheck = [
    "ty",
]
docs = [
    "mkdocs-material>=9",
    "mkdocs-git-revision-date-localized-plugin>=1",
    "mkdocs-minify-plugin>=0.7",
    "mkdocstrings[python]>=0.24",
]
coverage = [
    "coverage>=7",
    { include-group = "test" },
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "docs" },
]
