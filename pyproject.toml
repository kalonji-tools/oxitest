[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "oxitest"
dynamic = ["version"]
requires-python = ">=3.11"
description = "A fast Python test runner written in Rust"
license = { text = "MIT" }
# Derived from the tested platform set, never the reverse (ADR-0013), and held
# there by scripts/check_platform_sets.py. Trove classifiers carry no
# architecture axis, so this is the OS projection of that set: both Linux rows
# and both macOS rows collapse to one entry each.
#
# Deliberately no `Programming Language :: Python :: 3.x` entries. Those would
# be a fourth platform-shaped set that nothing compares against
# `requires-python`, which is the drift ADR-0013 exists to prevent.
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

[project.scripts]
oxitest = "oxitest:main"

[tool.maturin]
module-name = "oxitest._oxitest"
python-source = "python"
features = ["pyo3/extension-module"]
# rust-toolchain.toml pins the *development* toolchain (#1792). Cargo puts it in
# the package file list, so the sdist would carry it and every source install —
# musl, PyPy, `--no-binary`, anything without a wheel — would demand that exact
# release, which rustup >= 1.28 refuses to install on its own. Source builds use
# whatever toolchain the user already has, as they did before the pin existed.
exclude = [{ path = "rust-toolchain.toml", format = "sdist" }]

[tool.ruff]
target-version = "py311"
line-length = 88

# The linted surface is declared here rather than as path arguments in the
# justfile, so one file defines it. `just check` invokes ruff with no paths.
#
# `include` REPLACES ruff's defaults (`*.py`, `*.pyi`, `**/pyproject.toml`)
# rather than extending them, so the last two entries are load-bearing: a
# first attempt listing only `**/*.py` dropped `python/oxitest/_oxitest.pyi`
# and 55 test-data `pyproject.toml` files, and every gate stayed green while
# covering 56 fewer files. Verify with `ruff check --show-files` after editing.
include = [
    "python/**/*.py",
    "python/**/*.pyi",
    "scripts/**/*.py",
    "benchmarks/**/*.py",
    "**/pyproject.toml",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ── Formatter conflicts ──────────────────────────────────────────────
    "COM812",         # trailing comma — conflicts with ruff formatter
    "ISC001",         # implicit string concat — conflicts with ruff formatter

    # ── Docstring style conflicts ────────────────────────────────────────
    "D203",           # blank line before class docstring — conflicts with D211
    "D213",           # multi-line summary second line — conflicts with D212

    # ── Intentional design decisions ─────────────────────────────────────
    "TC001",          # get_type_hints() resolves annotations at runtime — imports must stay
    "TC002",          # same: runtime annotation resolution needs imports in namespace
    "TC003",          # same: stdlib types used in annotations resolved by get_type_hints()

    # ── Not yet addressed (TODO: fix incrementally) ──────────────────────
    "ANN401",         # dynamically typed expressions (Any) — legitimately Any in fixture/plugin system

    # ── Not applicable (pytest-specific) ────────────────────────────────
    "PT",             # flake8-pytest-style — oxitest is not pytest; PT001-PT031 are all inapplicable (PTH pathlib rules remain enabled)
]

[tool.ruff.lint.per-file-ignores]
# ── Source code ─────────────────────────────────────────────────────────
"python/oxitest/_bridge/worker.py" = ["PLC0415"]

# ── Review tooling ──────────────────────────────────────────────────────
# These shell out to `gh`, which must be resolved from PATH rather than by
# absolute path — the devenv shell is what puts it there, and hard-coding a
# store path would break on every rebuild. Every argument is repo-controlled,
# never user input. Listed per file rather than as `scripts/*` so a future
# script that shells out has to justify itself here (#2007).
"scripts/check_review_threads.py" = ["S603", "S607"]
"scripts/post_review_findings.py" = ["S603", "S607"]
"scripts/dispose_finding.py" = ["S603", "S607"]
"scripts/check_closing_issues.py" = ["S603", "S607"]

# ── Test data projects ──────────────────────────────────────────────────
"python/tests/data/**" = ["D100", "D103", "D104"]

# ── Test infrastructure ─────────────────────────────────────────────────
"python/tests/*" = [
    "PLR2004",  # magic values in comparisons — universal in test assertions
    "S101",     # assert
    "S603",     # subprocess call — output tests run oxitest as subprocess is the primary assertion mechanism in tests
    "INP001",   # no __init__.py (test dirs are not packages)
]

# ── Doc examples (user-facing code snippets) ───────────────────────────
"python/tests/docs/**" = [
    "ANN",      # all annotation rules — docs show beginner-friendly code
    "ARG001",   # unused args — parametrize examples may not use all params
    "ARG002",   # unused method args — stub methods ignore parameters
    "A002",     # builtin shadowing — stub User(id=...) mirrors real APIs
    "D101",     # class docstrings — dataclass examples are self-documenting
    "D102",     # method docstrings — test class methods are self-descriptive
    "D103",     # function docstrings — snippets show minimal examples
    "D107",     # __init__ docstrings — stub classes are self-documenting
    "E402",     # import order — snippet blocks have imports after module-level code
    "E501",     # line length
    "F403",     # star imports — output tests use from _helpers import *
    "F405",     # undefined from star — output tests use from _helpers import * — assertion messages push past 88 chars
    "ERA001",   # commented-out code — plugin examples show config patterns
    "FBT003",   # boolean positional — reporter.finish([], False) is idiomatic
    "INP001",   # no __init__.py (not a package)
    "LOG015",   # root logger — docs show simplest logging pattern
    "PLC0415",  # import inside function — fixture stubs need local imports
    "PLR2004",  # magic values — examples use literal comparisons
    "PTH109",   # os.getcwd — docs show stdlib patterns users know
    "S101",     # assert
    "S603",     # subprocess call — output tests run oxitest as subprocess — examples use assert for clarity
    "SLF001",   # private member access — tests verify internal state of stubs
    "T100",     # debugger — ipdb backend snippet shows set_trace/post_mortem usage
    "T201",     # print — capture examples must print to demonstrate the feature
]

# ── PLC0415: intentionally lazy imports ─────────────────────────────────
"python/tests/fixtures/oxitest_sample_infra/__init__.py" = ["PLC0415"]
"python/tests/fixtures/oxitest_sample_metrics/__init__.py" = ["PLC0415"]

# ── S102: exec() required for AST-rewritten module loading ──────────────
"python/tests/test_assert_error.py" = ["S102"]
"python/tests/test_importer.py" = ["S102"]

# ── S603: subprocess calls in test infrastructure ───────────────────────
"python/tests/conftest.py" = ["S603"]
"python/tests/integration/*" = ["S603"]
"python/tests/test_worker.py" = ["S603"]

# ── Scripts and benchmarks ──────────────────────────────────────────────
"scripts/*" = ["T201"]
"benchmarks/*.py" = ["T201", "E402",     # import order — snippet blocks have imports after module-level code
    "E501", "PLR2004", "S101"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python = ".venv"
extra-paths = ["python", "python/tests"]

[[tool.ty.overrides]]
# Doc-example test files may import optional deps (trio, ipdb) not in devenv,
# and use dynamic attribute assignment on ModuleType in collector tests.
include = ["python/tests/docs/how-to/test_write_plugins.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[tool.oxitest]
testpaths = ["python/tests", "python/oxitest"]
norecursedirs = ["docs", "fixtures", "data"]
python_files = ["test_*.py"]
strict = "abort"
timeout = 30
markers = [
    "docs: documentation example tests",
    "slow: marks tests that take more than a second",
]
affected_base = "main"

[tool.oxitest.doctest]
scope = "public"
# `testpaths` above holds a test root and a library root. The audit asks which
# of them carries public API, and that is this key (#1790). Before it existed
# the only way to say so was a pair of `skip` entries naming the test helpers
# one by one.
roots = ["python/oxitest"]

[tool.coverage.run]
source = ["python/oxitest"]
parallel = true

[tool.coverage.paths]
source = ["python/oxitest"]

[tool.codespell]
skip = "target,Cargo.lock,devenv.lock,*.min.js,./docs/site,./docs/internals/book,./docs/superpowers"
ignore-words-list = "NotIn,ser,sotre,ratatui"

[dependency-groups]
build = [
    "maturin>=1.7,<2",
]
test = [
    { include-group = "build" },
    "coverage>=7",
]
lint = [
    "ruff>=0.4",
    "codespell>=2",
    # scripts/check_rollup_agreement.py, run by the `rollup-agreement` prek hook.
    # It must be in `lint` specifically: quality.yml passes exactly
    # `--only-group lint --only-group typecheck --only-group test` to the
    # setup-python composite, so that is the environment prek runs in. PyYAML was
    # already present locally only as a transitive dependency of mkdocs, which
    # `--only-group` excludes — the checker would have passed here and died in CI.
    "pyyaml>=6",
]
typecheck = [
    "ty",
]
docs = [
    "mkdocs-material>=9",
    "mkdocs-awesome-pages-plugin>=2.10",
    "mkdocs-git-revision-date-localized-plugin>=1",
    "mkdocs-minify-plugin>=0.7",
    "mkdocstrings[python]>=0.24",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "docs" },
]
