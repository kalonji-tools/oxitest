[tool.oxitest]
testpaths = ["slice3_inprocess_reject"]
python_files = ["test_*.py"]
strict = "abort"
# Arrangement pins modules to the main process, which would collapse a parallel
# run to one PID and make the exactly-once assertion prove nothing about the
# worker path. The whole point of this project is that the guarantee survives
# parallel execution, so arrangement must stay off.
# Force parallelism regardless of test count: the serial answer was always
# correct, so a run that quietly fell back to serial would pass vacuously.
min_parallel_tests = 1
