[tool.oxitest]
testpaths = ["slice9_autouse_process"]
python_files = ["test_*.py"]
strict = "abort"
# Arrangement pins modules to the main process, which would collapse a parallel
# run to one PID and make the per-process assertion prove nothing.
# Force parallelism regardless of test count: a run that quietly fell back to
# serial would pass vacuously, since a serial run has one process for everything.
min_parallel_tests = 1
